name: Native slice checks
on:
  push:
    branches: ['feat/dm-00', 'feat/dm-01', 'feat/dm-02']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Enable Windows Git long paths before submodule checkout
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download pinned official engine and verify checksum
        shell: python
        run: |
          import hashlib, os, pathlib, platform, urllib.request, zipfile
          windows = platform.system() == 'Windows'
          asset = 'Godot_v4.7.2-stable_win64.exe.zip' if windows else 'Godot_v4.7.2-stable_linux.x86_64.zip'
          expected = '83decd58fdf67b9d657958a1ae6bf1929c20785315a81effe245874cdc57acb709bf868e00778a96984338c1b29dafdb453c6847747694621c6ecf5da2259993' if windows else '9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65'
          payload = urllib.request.urlopen('https://github.com/godotengine/godot/releases/download/4.7.2-stable/' + asset, timeout=120).read()
          assert hashlib.sha512(payload).hexdigest() == expected, 'Official archive checksum mismatch'
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / asset
          archive.write_bytes(payload)
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'godot'
          with zipfile.ZipFile(archive) as z:
              z.extractall(destination)
          name = 'Godot_v4.7.2-stable_win64_console.exe' if windows else 'Godot_v4.7.2-stable_linux.x86_64'
          binary = destination / name
          if not windows:
              binary.chmod(0o755)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write('DM_GODOT=' + str(binary) + '\n')
      - name: Native import, scene contract and startup
        shell: python
        run: |
          import os, subprocess
          output = os.path.join(os.environ['RUNNER_TEMP'], 'native-check.json')
          subprocess.run(['python', 'tools/check_project.py', '--godot', os.environ['DM_GODOT'], '--output', output], check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/native-check.json
      - name: Capture scripted native scene on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a "$DM_GODOT" --path . --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/manual/replay_terrain.gd --write-movie "$RUNNER_TEMP/dm02.avi" --fixed-fps 60
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && success()
        with:
          name: dm02-native-capture-${{ github.sha }}
          path: |
            artifacts/evidence/dm-02/*.png
            ${{ runner.temp }}/dm02.avi
      - name: Package Windows development playtest
        if: runner.os == 'Windows'
        shell: python
        run: |
          import os, pathlib, subprocess
          engine = pathlib.Path(os.environ['DM_GODOT']).with_name('Godot_v4.7.2-stable_win64.exe')
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'DiceMercenaries_DM02_Windows.zip'
          subprocess.run(['python', 'tools/package_playtest.py', '--engine', str(engine), '--output', str(output)], check=True)
          subprocess.run(['python', 'tools/verify_playtest.py', '--zip', str(output), '--output', str(output.with_suffix('.json'))], check=True)
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && success()
        with:
          name: dm02-windows-playtest-${{ github.sha }}
          path: |
            ${{ runner.temp }}/DiceMercenaries_DM02_Windows.zip
            ${{ runner.temp }}/DiceMercenaries_DM02_Windows.json
